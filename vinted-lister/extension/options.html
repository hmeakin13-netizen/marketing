<!doctype html>
<meta charset="utf-8" />
<title>Vinted Lister settings</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #0f172a; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  button { margin-top: 20px; padding: 8px 16px; border: 0; border-radius: 6px; background: #0d9488; color: #fff; font: inherit; cursor: pointer; }
  #msg { margin-top: 12px; color: #475569; }
  small { color: #64748b; }
</style>
<h1>Vinted Lister</h1>
<label>App address <input id="apiBase" placeholder="http://localhost:3000" /></label>
<small>Where your Vinted Lister web app is running.</small>
<label>Extension key <input id="key" type="password" autocomplete="off" /></label>
<small>Copy it from the web app ("Chrome extension" box). Treat it like a password.</small>
<button id="save">Save</button>
<p id="msg"></p>
<script src="options.js"></script>
