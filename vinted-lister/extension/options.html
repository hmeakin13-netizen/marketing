<!doctype html>
<meta charset="utf-8" />
<title>Vinted Lister settings</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #d9f5e6; background: #040907; }
  h1 { color: #39ff88; text-shadow: 0 0 16px rgba(57,255,136,.55); }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 6px; border: 1px solid #143325; border-radius: 6px; background: #0a1410; color: #d9f5e6; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid #39ff88; outline-offset: 2px; }
  button { margin-top: 20px; padding: 8px 16px; border: 0; border-radius: 6px; background: #39ff88; color: #040907; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 0 12px rgba(57,255,136,.45); }
  #msg { margin-top: 12px; color: #8bb5a0; }
  small { color: #8bb5a0; }
</style>
<h1>Vinted Lister</h1>
<label>App address <input id="apiBase" placeholder="http://localhost:3000" /></label>
<small>Where your Vinted Lister web app is running.</small>
<label>Extension key <input id="key" type="password" autocomplete="off" /></label>
<small>Copy it from the web app ("Chrome extension" box). Treat it like a password.</small>
<button id="save">Save</button>
<p id="msg"></p>
<script src="options.js"></script>
