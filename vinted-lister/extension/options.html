<!doctype html>
<meta charset="utf-8" />
<title>Vinted Lister settings</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1f2a2b; background: #faf7f2; }
  h1 { color: #0a7f72; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 9px; margin-top: 6px; border: 1px solid #e8e2d9; border-radius: 10px; background: #fff; color: #1f2a2b; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid #0a7f72; outline-offset: 2px; }
  button { margin-top: 20px; padding: 9px 20px; border: 0; border-radius: 999px; background: #0a7f72; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #086a5f; }
  #msg { margin-top: 12px; color: #5d6b6a; }
  small { color: #5d6b6a; }
</style>
<h1>Vinted Lister</h1>
<label>App address <input id="apiBase" placeholder="http://localhost:3000" /></label>
<small>Where your Vinted Lister web app is running.</small>
<label>Extension key <input id="key" type="password" autocomplete="off" /></label>
<small>Copy it from the web app ("Chrome extension" box). Treat it like a password.</small>
<label>Access secret <small>(only if your app is behind Vercel login)</small> <input id="accessSecret" type="password" autocomplete="off" /></label>
<small>Shown under the key in the web app when it's needed.</small>
<button id="save">Save &amp; test connection</button>
<p id="msg"></p>
<script src="options.js"></script>
